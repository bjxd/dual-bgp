# Default values for dual-bgp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Full bgpAdvertisement.spec supported except for ipAddressPools and ipAddressPoolSelectors.
# https://metallb.io/apis/#bgpadvertisementspec
# ipAddressPools should be defined using the top-level ipAddressPools list.
# ipAddressPoolSelectors spec not used as all pools should be advertised.
bgpAdvertisementSpec: {}

# Values of 'myASN', 'peerASN' and 'peerAddress' meets minimum spec for a BGPPeer resource.
# Full BGPPeer spec supported in 'extraOptions' for each peer object below.
# https://metallb.io/apis/#bgppeerspec
bgpPeer1:
  myASN: null
  peerASN: null
  peerAddress: null
  extraOptions: {}
  # Example usage:
  # extraOptions:
  #   holdTime: "120s"
  #   keepaliveTime: "30s"
  #   passwordSecret:
  #     name: bgp-secret
  #     key: password
bgpPeer2:
  myASN: null
  peerASN: null
  peerAddress: null
  extraOptions: {}

ipAddressPools: []
